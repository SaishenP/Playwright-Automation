name: Playwright Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run Playwright Test Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps

      - name: Serve TechShop fixed app in background
        run: |
          npx --yes serve techshop/fixed-app -l 3000 &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000 > /dev/null; then
              echo "TechShop server is live on http://127.0.0.1:3000"
              break
            fi
            echo "Waiting for TechShop server on port 3000..."
            sleep 1
          done

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright traces and test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

